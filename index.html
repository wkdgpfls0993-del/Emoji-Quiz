<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>이거 제 이모지야 🌍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8EC; --card:#FFFFFF; --ink:#2B2340; --sub:#6B6385; --line:#EADFCB;
  --accent:#7C4DFF; --accent-soft:#EFE8FF; --orange:#FF8A3D; --orange-soft:#FFEBDD;
  --ok:#22A866; --ok-soft:#E2F6EC; --warn:#E5484D;
  --emoji:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  --display:"Jua","Gowun Dodum",sans-serif;
  --body:"Gowun Dodum","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);}
body{min-height:100vh;background:
  radial-gradient(circle at 10% 0%, #FFE7C7 0, transparent 40%),
  radial-gradient(circle at 100% 100%, #E9E1FF 0, transparent 45%), var(--bg);}
button{font-family:var(--display);cursor:pointer;border:none;color:inherit}
.emo{font-family:var(--emoji);line-height:1}
#app{max-width:1280px;margin:0 auto;padding:20px 16px 40px;}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0}

/* 공통 버튼 */
.btn{font-size:clamp(18px,1.8vw,24px);padding:14px 24px;border-radius:18px;background:var(--card);
  box-shadow:0 4px 0 var(--line), 0 0 0 2px var(--line) inset;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line), 0 0 0 2px var(--line) inset}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 4px 0 #5A2FD6}
.btn.orange{background:var(--orange);color:#fff;box-shadow:0 4px 0 #D96A20}
.btn.ok{background:var(--ok);color:#fff;box-shadow:0 4px 0 #17804C}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.small{font-size:16px;padding:8px 14px;border-radius:12px}
.kbd{font-family:var(--body);font-size:.7em;opacity:.75;margin-left:6px}

/* 상단바 */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top .grow{flex:1}
.progress{font-family:var(--display);font-size:22px;color:var(--sub)}
.scores{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--display);font-size:20px;padding:6px 14px;border-radius:999px;color:#fff;display:flex;gap:8px;align-items:center}
.chip b{font-weight:400;background:rgba(255,255,255,.3);border-radius:999px;padding:0 10px}
.chip.active{outline:4px solid var(--ink);outline-offset:2px}

/* 인트로 */
.hero{text-align:center;padding:30px 0 10px}
.hero .big{font-size:clamp(70px,10vw,130px)}
.hero h1{font-size:clamp(36px,5.5vw,72px);margin-top:10px}
.hero h1 .blank{color:var(--accent);border-bottom:6px dashed var(--accent);padding:0 8px}
.hero p{font-family:var(--display);font-size:clamp(22px,2.6vw,34px);color:var(--orange);margin:8px 0 0}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:30px}
.mode{background:var(--card);border-radius:28px;padding:28px;text-align:left;font-family:var(--body);
  box-shadow:0 8px 0 var(--line), 0 0 0 3px var(--line) inset;transition:transform .15s}
.mode:hover{transform:translateY(-4px)}
.mode .icon{font-size:64px}
.mode h2{font-size:34px;margin:10px 0 6px}
.mode .tag{display:inline-block;font-family:var(--display);font-size:16px;padding:4px 12px;border-radius:999px;margin-bottom:10px}
.mode p{font-size:18px;color:var(--sub);margin:4px 0;line-height:1.5}
.mode .example{margin-top:14px;padding:12px 16px;border-radius:16px;font-size:18px}
.tip{margin-top:28px;background:var(--card);border-radius:20px;padding:16px 22px;font-size:17px;color:var(--sub);line-height:1.6;border:2px dashed var(--line)}

/* 설정 화면 */
.panel{background:var(--card);border-radius:28px;padding:32px;max-width:720px;margin:20px auto;box-shadow:0 8px 0 var(--line), 0 0 0 3px var(--line) inset}
.panel h2{font-size:38px;margin-bottom:6px}
.panel .desc{color:var(--sub);font-size:18px;line-height:1.6;margin-bottom:20px}
.opt{margin:18px 0}
.opt label{display:block;font-family:var(--display);font-size:22px;margin-bottom:8px}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{font-size:20px;padding:10px 20px;border-radius:14px;background:var(--bg);box-shadow:0 0 0 2px var(--line) inset}
.pill.on{background:var(--accent);color:#fff;box-shadow:none}
.styles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.styles{grid-template-columns:1fr}}
.style{text-align:left;padding:16px 18px;border-radius:18px;background:var(--bg);box-shadow:0 0 0 2px var(--line) inset;display:flex;flex-direction:column;gap:4px}
.style .emo{font-size:36px}
.style b{font-weight:400;font-size:24px}
.style small{font-family:var(--body);font-size:16px;color:var(--sub);line-height:1.4}
.style.on{background:var(--orange-soft);box-shadow:0 0 0 3px var(--orange) inset}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;position:sticky;top:0;background:var(--card);padding:4px 0 8px;z-index:2}
.tab{font-size:17px;padding:8px 14px;border-radius:12px;background:var(--bg);box-shadow:0 0 0 2px var(--line) inset}
.tab.on{background:var(--accent);color:#fff;box-shadow:none}
.rules{background:var(--orange-soft);border-radius:16px;padding:14px 18px;font-size:17px;line-height:1.7;margin-top:16px}

/* 말풍선 무대 */
.stage{background:var(--card);border-radius:32px;padding:clamp(18px,3vw,36px);box-shadow:0 10px 0 var(--line), 0 0 0 3px var(--line) inset}
.speaker{display:flex;align-items:center;gap:18px;justify-content:center;flex-wrap:wrap}
.mascot{font-size:clamp(64px,8vw,110px);animation:flip 2.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flip{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-10deg)}86%{transform:rotate(6deg)}}
.bubble{position:relative;background:var(--accent-soft);border-radius:28px;padding:18px 30px;font-family:var(--display);
  font-size:clamp(30px,4.2vw,56px);text-align:center}
.bubble::before{content:"";position:absolute;left:-18px;top:50%;margin-top:-14px;border:14px solid transparent;border-right:18px solid var(--accent-soft);border-left:0}
.bubble .name{color:var(--accent);display:inline-block;min-width:3ch}
.bubble .name.hidden{background:var(--ink);color:var(--ink);border-radius:12px;padding:0 10px;color:#fff}
.bubble small{display:block;font-size:.55em;color:var(--orange);margin-top:4px}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* 모드1 힌트 */
.hints{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px}
@media (max-width:720px){.hints{grid-template-columns:1fr}}
.hint{border-radius:24px;padding:18px;text-align:center;background:var(--bg);border:3px dashed var(--line);min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.hint.open{background:#fff;border:3px solid var(--accent)}
.hint .lab{font-family:var(--display);font-size:18px;color:var(--sub)}
.hint .e{font-size:clamp(56px,7vw,96px)}
.hint .q{font-family:var(--display);font-size:72px;color:var(--line)}
.hint .why{font-size:17px;line-height:1.5;color:var(--ink);background:var(--ok-soft);border-radius:14px;padding:8px 12px;margin-top:4px}
.choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.choice{font-family:var(--display);font-size:clamp(24px,2.6vw,34px);padding:14px 30px;border-radius:18px;background:var(--orange-soft);color:#B4531A;box-shadow:0 4px 0 #F3C9A8;transition:transform .08s}
.choice:hover:not(:disabled){transform:translateY(-2px)}
.choice:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #F3C9A8}
.choice:disabled{cursor:default}
.choice.right{background:var(--ok);color:#fff;box-shadow:0 4px 0 #17804C}
.choice.wrong{background:#F1ECE4;color:#A79E92;box-shadow:none;text-decoration:line-through;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:20px}
.controls .label{font-family:var(--display);font-size:22px;color:var(--sub)}
.teambtn{color:#fff}
.banner{text-align:center;font-family:var(--display);font-size:30px;margin-top:18px}

/* 모드2 */
.turn-title{text-align:center;font-family:var(--display);font-size:clamp(34px,4.5vw,60px)}
.turn-sub{text-align:center;font-size:22px;color:var(--sub);margin-top:6px}
.secret{margin:28px auto 0;max-width:520px;user-select:none;-webkit-user-select:none;touch-action:none;
  background:var(--ink);color:#fff;border-radius:28px;padding:34px;text-align:center;font-family:var(--display);font-size:26px}
.secret .reveal{display:none;font-size:clamp(48px,6vw,80px);color:#FFD66B}
.secret.peek .reveal{display:block}
.secret.peek .cover{display:none}
.secret.mini{padding:12px 18px;font-size:18px;margin:0;max-width:none}
.secret.mini .reveal{font-size:34px}
.compose{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:20px;align-items:start}
@media (max-width:900px){.compose{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:12px}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.slot{aspect-ratio:1;border-radius:16px;border:3px dashed var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:clamp(30px,3vw,44px)}
.slot.filled{border:3px solid var(--accent);background:#fff;cursor:pointer}
.slot.filled:hover{background:#FFECEC}
.palette{background:var(--card);border-radius:24px;padding:16px;box-shadow:0 0 0 3px var(--line) inset}
.cat{margin-bottom:12px}
.cat h3{font-size:19px;color:var(--sub);margin:0 0 6px}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.ebtn{font-family:var(--emoji);font-size:clamp(28px,2.6vw,38px);width:clamp(48px,4.2vw,62px);height:clamp(48px,4.2vw,62px);border-radius:14px;background:var(--bg)}
.ebtn:hover{background:var(--accent-soft)}
.ebtn.used{background:var(--accent);}
.big-emojis{display:flex;gap:clamp(10px,2vw,28px);justify-content:center;flex-wrap:wrap;margin-top:24px}
.big-emojis .cell{text-align:center}
.big-emojis .e{font-size:clamp(70px,9vw,140px)}
.big-emojis .t{font-family:var(--display);font-size:18px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 12px;display:inline-block;margin-top:8px}
.timer{height:18px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:22px}
.timer div{height:100%;background:var(--orange);transition:width 1s linear}
.timer-num{text-align:center;font-family:var(--display);font-size:34px;margin-top:8px}
.timer-num.up{color:var(--warn)}
.discuss{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:22px}
.discuss div{border-radius:18px;padding:16px 18px;font-size:19px;line-height:1.55}

/* 결과 */
.podium{display:flex;flex-direction:column;gap:12px;max-width:620px;margin:24px auto}
.rank{display:flex;align-items:center;gap:16px;border-radius:20px;padding:16px 22px;color:#fff;font-family:var(--display);font-size:30px}
.rank .m{font-size:40px;font-family:var(--emoji)}
.rank .s{margin-left:auto}

.burst{position:fixed;pointer-events:none;font-family:var(--emoji);font-size:42px;z-index:99;animation:fly 1.3s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
</style>
</head>
<body>
<div id="app"></div>

 {n:'이탈리아', h:[['🌋👢','지형','장화 모양 반도! 베수비오 화산이 있어요.'],['🫒🍇','농업','여름이 건조한 지중해성 기후라 올리브·포도를 길러요.'],['🍕🏛️','상징','피자와 콜로세움.']]},

/* ---------- 모드 1 ---------- */
let Q=null;
function start1(){
  const c=S.cfg1;
  const deck=shuffle(QUIZ); const count=c.count==='all'?deck.length:Math.min(c.count,deck.length);
  Q={deck:deck.slice(0,count),idx:0,solved:0};
  resetQ(); go('quiz');
}
function resetQ(){
  Q.stage=1; Q.revealed=false; Q.wrong=[]; Q.win=false;
  const others=shuffle(QUIZ.filter(x=>x.n!==cur().n)).slice(0,3).map(x=>x.n);
  Q.choices=shuffle([...others,cur().n]);
}
function cur(){ return Q.deck[Q.idx]; }
function nextHint(){ if(Q.revealed) return nextQ(); if(Q.stage<3){Q.stage++; render();} }
function choose(i){
  if(Q.revealed) return;
  const c=Q.choices[i];
  if(c===cur().n){ Q.win=true; Q.solved++; reveal1(); burst(); }
  else if(!Q.wrong.includes(c)){ Q.wrong.push(c); render(); }
}
function reveal1(){ if(Q.revealed) return; Q.revealed=true; Q.stage=3; render(); }
function nextQ(){ Q.idx++; if(Q.idx>=Q.deck.length){ go('result1'); return;} resetQ(); render(); }

VIEWS.quiz=()=>{
  const q=cur();
  return `
  ${topbar(`문제 ${Q.idx+1} / ${Q.deck.length}`)}
  <div class="stage">
    <div class="speaker">
      <div class="mascot emo">💁</div>
      <div class="bubble">안녕~ ${Q.revealed?`<span class="name pop">${q.n}</span>`:`<span class="name hidden">???</span>`}입니다!<small>이거 제 이모지야~</small></div>
    </div>
    <div class="hints">
      ${q.h.map((h,i)=>{
        const open=i<Q.stage;
        return `<div class="hint ${open?'open':''}">
          <div class="lab">${HINT_LABEL[i]} · ${h[1]}</div>
          ${open?`<div class="e emo pop">${h[0]}</div>`:`<div class="q">?</div>`}
          ${Q.revealed?`<div class="why">${h[2]}</div>`:''}
        </div>`;}).join('')}
    </div>
    <div class="choices">${Q.choices.map((c,i)=>{
      const cls = Q.revealed&&c===q.n ? 'right' : Q.wrong.includes(c) ? 'wrong' : '';
      return `<button class="choice ${cls}" onclick="choose(${i})" ${Q.revealed||Q.wrong.includes(c)?'disabled':''}>${Q.wrong.includes(c)?'❌ ':''}${c}</button>`;}).join('')}</div>
    ${Q.revealed?`<div class="banner">${Q.win?`${E('🎉')} 정답! <b style="color:var(--accent)">${q.n}</b>였어요!`:`${E('🤔')} 정답은 <b style="color:var(--accent)">${q.n}</b>!`}</div>`
      : Q.wrong.length?`<div class="banner" style="font-size:24px;color:var(--sub)">${E('🙅')} 아니에요! ${Q.stage<3?'힌트를 더 열어 볼까요?':'다시 골라 봐요!'}</div>`:''}
  </div>
  <div class="controls">
    ${Q.revealed
      ? `<button class="btn primary" onclick="nextQ()">${Q.idx+1>=Q.deck.length?'결과 보기 🏆':'다음 나라 ▶'}<span class="kbd">Space</span></button>`
      : `<button class="btn primary" onclick="nextHint()" ${Q.stage>=3?'disabled':''}>다음 이모지 ▶<span class="kbd">Space</span></button>
         <button class="btn" onclick="reveal1()">정답 공개<span class="kbd">Enter</span></button>`}
  </div>`;
};

/* ---------- 모드 2 ---------- */
let R=null;
function start2(){
  const c=S.cfg2;
  const together=c.style==='together';
  R={together,teams:together?[]:makeTeams(c.teams),total:together?c.count:c.teams*c.rounds,turn:0,
     deck:shuffle(ALL_NAMES),time:c.time,tab:-1,history:[],solved:0};
  newTurn(); go('catch');
}
function presenter(){ return R.together?-1:R.turn%R.teams.length; }
function setTab(i){ R.tab=i; render(); }
function newTurn(){ R.phase='peek'; R.picks=[]; R.reroll=1; R.result=null; R.country=R.deck.pop()||shuffle(ALL_NAMES)[0]; }
function reroll(){ if(R.reroll<=0) return; R.reroll--; R.country=R.deck.pop()||shuffle(ALL_NAMES)[0]; render(); }
function peek(on){ const el=document.getElementById('secret'); if(el) el.classList.toggle('peek',on); }
function pick(ci,ii){ if(R.picks.length>=5) return; R.picks.push(PALETTE[ci].items[ii]); render(); }
function unpick(i){ R.picks.splice(i,1); render(); }
function toCompose(){ R.phase='compose'; render(); }
function toGuess(){
  if(!R.picks.length) return;
  R.phase='guess'; R.left=R.time; R.timeUp=false; render();
  stopTimer();
  tick=setInterval(()=>{
    R.left--; const bar=document.getElementById('bar'), num=document.getElementById('num');
    if(bar) bar.style.width=(R.left/R.time*100)+'%';
    if(num){ num.textContent=R.left>0?`${R.left}초`:'⏰ 시간 끝!'; num.classList.toggle('up',R.left<=10); }
    if(R.left<=0){ stopTimer(); R.timeUp=true; }
  },1000);
}
function award2(t){
  stopTimer();
  if(t>=0){
    R.result={t}; R.solved++;
    if(!R.together){ R.teams[t].score+=2; R.teams[presenter()].score+=1; }
  }
  R.history.push({country:R.country,picks:[...R.picks],ok:t>=0});
  R.phase='reveal'; render(); if(t>=0) burst();
}
function nextTurn(){ R.turn++; if(R.turn>=R.total){ go('result2'); return; } newTurn(); render(); }

function secretCard(mini=false){
  return `<div id="secret" class="secret ${mini?'mini':''}"
     onpointerdown="peek(true)" onpointerup="peek(false)" onpointerleave="peek(false)" onpointercancel="peek(false)" oncontextmenu="return false">
     <div class="cover">${E('🤫')} ${mini?'꾹 눌러서 나라 다시 보기':'출제자만! 꾹 누르고 있으면 나라가 보여요'}</div>
     <div class="reveal">${R.country}</div>
  </div>`;
}

VIEWS.catch=()=>{
  const p=presenter(), pt=R.teams[p];
  const head=topbar(`출제 ${R.turn+1} / ${R.total}`,R.together?null:R.teams,p);
  const teamTag=R.together?'':`<span style="color:${pt.color}">${pt.name}</span>`;

  if(R.phase==='peek') return `${head}
    <div class="stage">
      <div class="turn-title">${E('🎤')} ${teamTag} 출제자, 앞으로 나와 주세요!</div>
      <div class="turn-sub">${E('🙈')} 다른 친구들은 잠깐 눈을 가려요</div>
      ${secretCard()}
      <div class="controls">
        <button class="btn" onclick="reroll()" ${R.reroll<=0?'disabled':''}>${E('🔄')} 다른 나라로 (${R.reroll}회)</button>
        <button class="btn orange" onclick="toCompose()">확인했어요 → 이모지 고르기</button>
      </div>
    </div>`;

  if(R.phase==='compose') return `${head}
    <div class="compose">
      <div class="side">
        <div class="stage" style="padding:18px">
          <div style="font-family:var(--display);font-size:24px;text-align:center">안녕~ ???입니다!<br><span style="color:var(--orange)">이거 제 이모지야~</span></div>
          <div class="slots" style="margin-top:14px">
            ${Array.from({length:5},(_,i)=>R.picks[i]?`<div class="slot filled emo" onclick="unpick(${i})" title="빼기">${R.picks[i]}</div>`:`<div class="slot"></div>`).join('')}
          </div>
          <div style="text-align:center;color:var(--sub);font-size:15px;margin-top:8px">최대 5개 · 순서도 힌트예요 · 누르면 빠져요</div>
        </div>
        ${secretCard(true)}
        <button class="btn orange" onclick="toGuess()" ${R.picks.length?'':'disabled'}>공개하기! ${E('📣')}</button>
      </div>
      <div class="palette">
        <div class="tabs">
          <button class="tab ${R.tab===-1?'on':''}" onclick="setTab(-1)">전체</button>
          ${PALETTE.map((c,ci)=>`<button class="tab ${R.tab===ci?'on':''}" onclick="setTab(${ci})">${E(c.items[0])} ${c.cat}</button>`).join('')}
        </div>
        ${PALETTE.map((c,ci)=>R.tab!==-1&&R.tab!==ci?'':`<div class="cat"><h3>${c.cat}</h3><div class="grid">${c.items.map((e,ii)=>`<button class="ebtn ${R.picks.includes(e)?'used':''}" onclick="pick(${ci},${ii})">${e}</button>`).join('')}</div></div>`).join('')}
      </div>
    </div>`;

  if(R.phase==='guess') return `${head}
    <div class="stage">
      <div class="speaker">
        <div class="mascot emo">💁</div>
        <div class="bubble">안녕~ <span class="name hidden">???</span>입니다!<small>이거 제 이모지야~</small></div>
      </div>
      <div class="big-emojis">${R.picks.map(e=>`<div class="cell"><div class="e emo pop">${e}</div></div>`).join('')}</div>
      <div class="timer"><div id="bar" style="width:${R.left/R.time*100}%"></div></div>
      <div id="num" class="timer-num ${R.left<=10?'up':''}">${R.left>0?R.left+'초':'⏰ 시간 끝!'}</div>
    </div>
    <div class="controls">
      ${R.together
        ? `<button class="btn ok" onclick="award2(0)">${E('🎉')} 맞혔어요!</button>`
        : `<span class="label">맞힌 팀 →</span>
           ${R.teams.map((t,i)=>i===p?'':`<button class="btn teambtn" style="background:${t.color};box-shadow:0 4px 0 rgba(0,0,0,.2)" onclick="award2(${i})">${t.name} 정답!</button>`).join('')}`}
      <button class="btn" onclick="award2(-1)">아무도 못 맞힘 · 정답 공개</button>
    </div>`;

  // reveal
  return `${head}
    <div class="stage">
      <div class="speaker">
        <div class="mascot emo">💁</div>
        <div class="bubble">안녕~ <span class="name pop">${R.country}</span>입니다!<small>이거 제 이모지야~</small></div>
      </div>
      <div class="big-emojis">${R.picks.map(e=>`<div class="cell"><div class="e emo">${e}</div><span class="t">${CAT_OF[e]||'기타'}</span></div>`).join('')}</div>
      <div class="banner">${R.result&&R.together?`${E('🎉')} 정답! 출제자도 맞힌 친구도 최고!`:R.result?`${E('🎉')} <span style="color:${R.teams[R.result.t].color}">${R.teams[R.result.t].name}</span> +2점 · ${teamTag} 출제 +1점`:`${E('😅')} 아쉽게 아무도 못 맞혔어요`}</div>
      <div class="discuss">
        <div style="background:var(--accent-soft)">${E('🎤')} <b>출제자 해명 타임</b><br>"제가 왜 ${E(R.picks[0])}냐면요~" 이모지마다 어떤 지리 특징인지 설명해 주세요.</div>
        <div style="background:var(--orange-soft)">${E('🤔')} <b>고정관념 체크</b><br>${R.country} 사람들도 자기 나라를 이 이모지로 소개할까요? 빠진 모습은 없을까요?</div>
      </div>
    </div>
    <div class="controls"><button class="btn orange" onclick="nextTurn()">${R.turn+1>=R.total?'결과 보기 🏆':R.together?'다음 출제자 ▶':'다음 팀 출제 ▶'}</button></div>`;
};

/* ---------- 결과 ---------- */
function resultView(teams,again){
  const sorted=[...teams].sort((a,b)=>b.score-a.score);
  const medals=['🥇','🥈','🥉','🏅'];
  const top=sorted[0].score; const winners=sorted.filter(t=>t.score===top);
  return `${topbar()}
    <div class="hero" style="padding-top:10px">
      <div class="big emo">🏆</div>
      <h1>${teams.length===1?`${top}점 획득!`:winners.length>1?'공동 우승!':`<span style="color:${winners[0].color}">${winners[0].name}</span> 우승!`}</h1>
      <p>안녕~ 우승팀입니다! 이거 제 이모지야~ ${E('😎')}</p>
    </div>
    <div class="podium">${sorted.map((t,i)=>`<div class="rank" style="background:${t.color}"><span class="m">${medals[t.score===top?0:Math.min(i,3)]}</span>${t.name}<span class="s">${t.score}점</span></div>`).join('')}</div>
    <div class="controls"><button class="btn primary" onclick="${again}">한 판 더! ${E('🔁')}</button><button class="btn" onclick="go('intro')">처음으로</button></div>`;
}
VIEWS.result1=()=>`${topbar()}
  <div class="hero" style="padding-top:10px">
    <div class="big emo">🌍</div>
    <h1>우리 반이 맞힌 나라 <span style="color:var(--accent)">${Q.solved}</span> / ${Q.deck.length}</h1>
    <p>오늘 만난 나라들, 이거 걔네 이모지야~ ${E('😎')}</p>
  </div>
  <div class="podium" style="max-width:820px">${Q.deck.map(q=>`<div class="rank" style="background:var(--card);color:var(--ink);box-shadow:0 0 0 3px var(--line) inset;font-size:24px">
    ${q.n}<span class="s emo" style="font-size:30px">${q.h.map(h=>h[0]).join(' ')}</span></div>`).join('')}</div>
  <div class="controls"><button class="btn primary" onclick="start1()">한 판 더! ${E('🔁')}</button><button class="btn" onclick="go('intro')">처음으로</button></div>`;
VIEWS.result2=()=>R.together?`${topbar()}
  <div class="hero" style="padding-top:10px">
    <div class="big emo">🤝</div>
    <h1>우리 반이 맞힌 나라 <span style="color:var(--orange)">${R.solved}</span> / ${R.total}</h1>
    <p>우리가 만든 나라 이모지 모음~ ${E('😎')}</p>
  </div>
  <div class="podium" style="max-width:820px">${R.history.map(h=>`<div class="rank" style="background:var(--card);color:var(--ink);box-shadow:0 0 0 3px var(--line) inset;font-size:24px">
    ${h.ok?'⭕':'❌'} ${h.country}<span class="s emo" style="font-size:30px">${h.picks.join(' ')}</span></div>`).join('')}</div>
  <div class="controls"><button class="btn orange" onclick="start2()">한 판 더! ${E('🔁')}</button><button class="btn" onclick="go('intro')">처음으로</button></div>`
  : resultView(R.teams,'start2()');

/* ---------- 키보드 ---------- */
document.addEventListener('keydown',e=>{
  if(S.screen!=='quiz') return;
  if(e.code==='Space'){ e.preventDefault(); nextHint(); }
  else if(e.key==='Enter'){ e.preventDefault(); if(!Q.revealed) reveal1(); else nextQ(); }
});

render();
</script>
</body>
</html>
